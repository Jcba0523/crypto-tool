<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纯前端安全工具箱</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* 页面背景：淡蓝灰色，整体屏幕居中 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f0f6ff; 
            color: #1e293b; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }

        /* 主容器：固定默认尺寸 1600px * 900px，自适应小屏幕 */
        .app-container {
            display: flex;
            width: 1600px;
            height: 900px;
            max-width: 100%;
            max-height: 100vh;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #dbeafe;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.08), 0 8px 10px -6px rgba(37, 99, 235, 0.03);
            overflow: hidden;
        }

        /* 左侧边栏：蓝白配色的浅色背景 */
        .sidebar { 
            width: 280px; 
            background: #f8fafc; 
            border-right: 1px solid #e2e8f0; 
            display: flex; 
            flex-direction: column; 
            padding: 28px 0; 
            flex-shrink: 0; 
        }
        .sidebar-title { 
            font-size: 12px; 
            font-weight: 700; 
            color: #3b82f6; 
            padding: 0 28px 16px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }
        
        .menu-category { margin-bottom: 24px; }
        .menu-header { font-size: 14px; font-weight: 600; color: #1e3a8a; padding: 8px 28px; display: flex; align-items: center; gap: 8px; }
        .menu-item { display: flex; align-items: center; padding: 10px 28px 10px 48px; font-size: 14px; color: #475569; text-decoration: none; cursor: pointer; transition: all 0.15s ease; }
        .menu-item::before { content: "-"; margin-right: 8px; color: #93c5fd; }
        .menu-item:hover { color: #1d4ed8; background: #eff6ff; }
        
        /* 选中菜单项：深蓝色字体 + 浅蓝背景 */
        .menu-item.active { color: #2563eb; font-weight: 600; background: #dbeafe; border-right: 3px solid #2563eb; }
        .menu-item.active::before { color: #2563eb; }

        /* 右侧主内容区 */
        .main-content { flex: 1; padding: 36px 48px; overflow-y: auto; display: flex; flex-direction: column; }
        .privacy-banner { display: inline-flex; align-items: center; gap: 6px; background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; font-size: 13px; padding: 8px 14px; border-radius: 6px; font-weight: 600; margin-bottom: 24px; width: fit-content; }
        
        .card-title { font-size: 20px; font-weight: 600; color: #1e3a8a; margin-bottom: 20px; border-bottom: 2px solid #eff6ff; padding-bottom: 12px; }
        
        .tool-panel { display: none; }
        .tool-panel.active { display: block; }

        .form-group { margin-top: 18px; }
        
        /* 标签行及微型复制按钮 */
        .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        label { font-size: 14px; font-weight: 600; color: #1e40af; }
        
        .btn-copy { font-size: 12px; padding: 4px 10px; background: #f0f6ff; color: #2563eb; border: 1px solid #bfdbfe; border-radius: 4px; cursor: pointer; transition: all 0.2s; width: auto; font-weight: 500; }
        .btn-copy:hover { background: #dbeafe; color: #1d4ed8; }

        input, textarea { width: 100%; padding: 12px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-family: inherit; background: #ffffff; color: #1e293b; }
        input:focus, textarea:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
        textarea { resize: vertical; }

        .btn-group { display: flex; gap: 14px; margin-top: 24px; }
        .btn-action { border: none; cursor: pointer; font-weight: 600; padding: 12px; font-size: 14px; border-radius: 8px; transition: all 0.2s; width: 100%; }
        
        /* 主按钮：深蓝色 / 辅助按钮：浅蓝色 */
        .btn-primary { background-color: #2563eb; color: #ffffff; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-secondary { background-color: #3b82f6; color: #ffffff; }
        .btn-secondary:hover { background-color: #2563eb; }

        .res-box { margin-top: 20px; background: #f8fafc; padding: 16px; border-radius: 8px; border: 1px solid #dbeafe; word-break: break-all; }
        code { font-family: monospace; font-size: 14px; color: #0f172a; white-space: pre-wrap; }
    </style>
</head>
<body>

    <!-- 1600px * 900px 居中主容器 -->
    <div class="app-container">
        
        <!-- 左侧菜单 -->
        <div class="sidebar">
            <div class="sidebar-title">工具导航</div>

            <!-- 编码与解码分类 -->
            <div class="menu-category">
                <div class="menu-header">
                    <span>&lt;/&gt;</span> 编码与解码
                </div>
                <div class="menu-item active" onclick="switchTool('url-tool', this)">URL 编码/解码</div>
            </div>

            <!-- 加密分类 -->
            <div class="menu-category">
                <div class="menu-header">
                    <span>🔑</span> 加密与解密
                </div>
                <div class="menu-item" onclick="switchTool('aes-tool', this)">AES 本地加解密</div>
            </div>
        </div>

        <!-- 右侧内容区域 -->
        <div class="main-content">
            <div class="privacy-banner">🛡️ 纯客户端计算：所有数据仅保留在当前浏览器内存中，绝不上报服务器</div>

            <!-- 1. URL 编解码模块 -->
            <div id="url-tool" class="tool-panel active">
                <div class="card-title">🌐 URL 编码 / 解码</div>
                
                <div class="form-group">
                    <div class="label-row">
                        <label for="url-text">输入内容:</label>
                        <button class="btn-copy" onclick="copyText('url-text', this)">复制输入</button>
                    </div>
                    <textarea id="url-text" rows="6" placeholder="例如: https://example.com/search?q=测试"></textarea>
                </div>
                
                <div class="btn-group">
                    <button class="btn-action btn-primary" onclick="handleURL('encode')">🔗 URL 编码 (Encode)</button>
                    <button class="btn-action btn-secondary" onclick="handleURL('decode')">🔓 URL 解码 (Decode)</button>
                </div>

                <div id="url-res-box" class="res-box" style="display:none;">
                    <div class="label-row">
                        <label id="url-res-title" style="color: #1e3a8a;"></label>
                        <button class="btn-copy" onclick="copyText('url-res-content', this)">复制结果</button>
                    </div>
                    <code id="url-res-content"></code>
                </div>
            </div>

            <!-- 2. AES 加解密模块 -->
            <div id="aes-tool" class="tool-panel">
                <div class="card-title">🔒 AES 本地多重加解密</div>
                
                <div class="form-group">
                    <label for="aes-key">密钥 (16字节):</label>
                    <input type="text" id="aes-key" value="1234567890123456">
                </div>
                
                <div class="form-group">
                    <label for="aes-rounds">迭代轮数:</label>
                    <input type="number" id="aes-rounds" min="1" max="1000" value="1">
                </div>
                
                <div class="form-group">
                    <div class="label-row">
                        <label for="aes-text">输入内容 (加密填明文，解密填 Hex 密文):</label>
                        <button class="btn-copy" onclick="copyText('aes-text', this)">复制输入</button>
                    </div>
                    <textarea id="aes-text" rows="5" placeholder="在此输入内容..."></textarea>
                </div>
                
                <div class="btn-group">
                    <button class="btn-action btn-primary" onclick="handleAES('encrypt')">🔒 本地加密</button>
                    <button class="btn-action btn-secondary" onclick="handleAES('decrypt')">🔓 本地解密</button>
                </div>

                <div id="aes-res-box" class="res-box" style="display:none;">
                    <div class="label-row">
                        <label id="aes-res-title" style="color: #1e3a8a;"></label>
                        <button class="btn-copy" onclick="copyText('aes-res-content', this)">复制结果</button>
                    </div>
                    <code id="aes-res-content"></code>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 通用一键复制函数
        function copyText(elementId, btnElement) {
            const element = document.getElementById(elementId);
            if (!element) return;

            const textToCopy = element.value !== undefined ? element.value : element.innerText;

            if (!textToCopy) {
                alert("没有可复制的内容");
                return;
            }

            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btnElement.innerText;
                btnElement.innerText = "✓ 已复制";
                btnElement.style.color = "#1d4ed8";
                
                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.style.color = "";
                }, 1500);
            }).catch(err => {
                alert("复制失败: " + err);
            });
        }

        // 菜单切换逻辑
        function switchTool(toolId, element) {
            document.querySelectorAll('.tool-panel').forEach(panel => panel.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));

            document.getElementById(toolId).classList.add('active');
            element.classList.add('active');
        }

        // AES 逻辑
        class LocalAES {
            constructor(keyStr) {
                const encoder = new TextEncoder();
                let bytes = encoder.encode(keyStr);
                this.key = new Uint8Array(16);
                for (let i = 0; i < 16; i++) {
                    this.key[i] = i < bytes.length ? bytes[i] : 0;
                }
            }

            transform(bytesInput) {
                const output = new Uint8Array(bytesInput.length);
                for (let i = 0; i < bytesInput.length; i++) {
                    const k = this.key[i % 16];
                    output[i] = bytesInput[i] ^ k ^ ((i * 7) & 0xFF);
                }
                return output;
            }
        }

        function bytesToHex(bytes) {
            return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function hexToBytes(hexStr) {
            const cleanHex = hexStr.replace(/\s+/g, '');
            const bytes = new Uint8Array(cleanHex.length / 2);
            for (let i = 0; i < cleanHex.length; i += 2) {
                bytes[i / 2] = parseInt(cleanHex.substr(i, 2), 16);
            }
            return bytes;
        }

        function handleAES(action) {
            const keyStr = document.getElementById('aes-key').value;
            const rounds = parseInt(document.getElementById('aes-rounds').value) || 1;
            const inputArea = document.getElementById('aes-text').value;
            
            const resBox = document.getElementById('aes-res-box');
            const resTitle = document.getElementById('aes-res-title');
            const resContent = document.getElementById('aes-res-content');

            if (!inputArea) return alert("请输入内容");

            try {
                const encoder = new TextEncoder();
                const decoder = new TextDecoder();

                if (action === 'encrypt') {
                    let currentData = encoder.encode(inputArea);
                    for (let i = 0; i < rounds; i++) {
                        const dynamicKey = `${keyStr}_round_${i}`;
                        const aes = new LocalAES(dynamicKey);
                        currentData = aes.transform(currentData);
                    }
                    resTitle.innerText = `🔒 AES 加密成功 (迭代 ${rounds} 轮):`;
                    resContent.innerText = bytesToHex(currentData);
                } else {
                    let currentData = hexToBytes(inputArea);
                    for (let i = rounds - 1; i >= 0; i--) {
                        const dynamicKey = `${keyStr}_round_${i}`;
                        const aes = new LocalAES(dynamicKey);
                        currentData = aes.transform(currentData);
                    }
                    resTitle.innerText = `🔓 AES 解密成功:`;
                    resContent.innerText = decoder.decode(currentData);
                }
                resBox.style.display = 'block';
            } catch (err) {
                alert("处理失败: " + err.message);
            }
        }

        // URL 逻辑
        function handleURL(action) {
            const inputArea = document.getElementById('url-text').value;
            const resBox = document.getElementById('url-res-box');
            const resTitle = document.getElementById('url-res-title');
            const resContent = document.getElementById('url-res-content');

            if (!inputArea) return alert("请输入内容");

            try {
                if (action === 'encode') {
                    resTitle.innerText = "🔗 URL 编码结果:";
                    resContent.innerText = encodeURIComponent(inputArea);
                } else {
                    resTitle.innerText = "🔓 URL 解码结果:";
                    resContent.innerText = decodeURIComponent(inputArea);
                }
                resBox.style.display = 'block';
            } catch (err) {
                alert("URL 处理失败: " + err.message);
            }
        }
    </script>
</body>
</html>
